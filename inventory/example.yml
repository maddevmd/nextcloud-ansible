---
# HTTP-only learning environment. Copy to inventory/local.yml.
all:
  children:
    nextcloud_servers:
      vars:
        project_dir: /opt/nextcloud-lab/stack
        nginx_http_port: 8080
        nextcloud_image: nextcloud:35.0.2-apache
        nextcloud_admin_user: ncadmin
        nextcloud_public_host: "192.0.2.10:8080"
        nextcloud_public_protocol: http
        # Learning build requires Buildx; deployment without a build is planned.
        build_storage_images: true
      hosts:
        lab:
          ansible_host: 192.0.2.10
          ansible_user: student
          ansible_ssh_private_key_file: ~/.ssh/nextcloud_lab
          ansible_python_interpreter: /usr/bin/python3
