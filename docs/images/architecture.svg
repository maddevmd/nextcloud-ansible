<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Nextcloud: Ansible and Docker Compose architecture</title>
<desc id="desc">Browser connects to nginx over HTTPS. nginx routes cloud to Nextcloud, office to ONLYOFFICE and auth to authentik. Nextcloud uses MinIO, PostgreSQL and Redis. authentik uses its own database in PostgreSQL. Ansible manages the host through SSH.</desc>
