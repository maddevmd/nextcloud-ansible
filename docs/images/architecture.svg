2" marker-end="url(#arrow)"/><path d="M1050 520 V555 H976 V630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="56" y="650" fill="#e2e8f0" font-size="17" font-weight="700">Public application ingress</text><text x="56" y="680" fill="#94a3b8" font-size="15">Only nginx publishes web ports.</text><text x="56" y="706" fill="#94a3b8" font-size="15">SSH is a separate admin channel.</text><text x="56" y="732" fill="#94a3b8" font-size="15">Databases, S3 and Redis stay internal.</text><text x="56" y="817" fill="#64748b" font-size="14">Working learning environment · fresh-host bootstrap and Vault remain in progress</text></g></svg>