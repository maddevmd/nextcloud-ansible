<text x="56" y="106" fill="#94a3b8" font-size="17">Ansible + Docker Compose · S3 · document editing · OpenID Connect</text>
<rect x="420" y="150" width="964" height="634" rx="22" fill="#111d30" stroke="#334155"/>
