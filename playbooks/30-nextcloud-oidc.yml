---
- name: Подготовить коннектор OIDC
  hosts: nextcloud_servers
  gather_facts: false
  become: true

  tasks:
    - name: Получить список приложений Nextcloud
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ project_dir }}/compose.yml"
          - exec
          - -T
          - --user
          - www-data
          - nextcloud
          - php
          - occ
          - app:list
          - --output=json
      register: nextcloud_apps
      changed_when: false

    - name: Установить отсутствующий коннектор
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ project_dir }}/compose.yml"
          - exec
          - -T
          - --user
          - www-data
          - nextcloud
          - php
          - occ
          - app:install
          - user_oidc
      when:
        - "'user_oidc' not in (nextcloud_apps.stdout | from_json).enabled"
        - "'user_oidc' not in (nextcloud_apps.stdout | from_json).disabled"

    - name: Включить установленный отключённый коннектор
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ project_dir }}/compose.yml"
          - exec
          - -T
          - --user
          - www-data
          - nextcloud
          - php
          - occ
          - app:enable
          - user_oidc
      when: "'user_oidc' in (nextcloud_apps.stdout | from_json).disabled"
