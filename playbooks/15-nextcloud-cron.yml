---
- name: Настроить фоновые задачи Nextcloud
  hosts: nextcloud_servers
  gather_facts: false
  become: true

  tasks:
    - name: Получить текущий режим фоновых задач
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ project_dir }}/compose.yml"
          - exec
          - -T
          - --user
          - www-data
          - nextcloud
          - php
          - occ
          - config:app:get
          - core
          - backgroundjobs_mode
          - --default-value=unset
      register: background_mode
      changed_when: false

    - name: Включить режим cron при необходимости
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ project_dir }}/compose.yml"
          - exec
          - -T
          - --user
          - www-data
          - nextcloud
          - php
          - occ
          - background:cron
      when: background_mode.stdout | trim != 'cron'

    - name: Запустить планировщик
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        profiles:
          - application
        services:
          - nextcloud-cron
        dependencies: false
        state: present
        pull: policy
        wait: true
        wait_timeout: 60
