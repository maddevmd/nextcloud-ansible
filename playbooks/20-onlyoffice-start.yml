---
- name: Запустить ONLYOFFICE
  hosts: nextcloud_servers
  gather_facts: false
  become: true

  tasks:
    - name: Проверить конфигурацию Compose
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ project_dir }}/compose.yml"
          - --profile
          - office
          - config
          - --quiet
      changed_when: false

    - name: Запустить контейнер ONLYOFFICE
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        profiles:
          - office
        services:
          - onlyoffice
        dependencies: false
        state: present
        pull: policy
        wait: true
        wait_timeout: 600
