---
- name: Запустить Nextcloud
  hosts: nextcloud_servers
  gather_facts: false
  become: true

  tasks:
    - name: Запустить приложение после подготовки зависимостей
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        profiles:
          - application
        services:
          - nextcloud
        dependencies: false
        state: present
        pull: policy
        wait: true
        wait_timeout: 600

    - name: Дождаться завершения первоначальной установки
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ project_dir }}/compose.yml"
          - exec
          - -T
          - --user
          - www-data
          - nextcloud
          - php
          - occ
          - status
          - --output=json
      register: nextcloud_status
      changed_when: false
      until: >-
        nextcloud_status.rc == 0
        and
        ((nextcloud_status.stdout | default('{}', true) | from_json).installed
        | default(false))
      retries: 30
      delay: 10
